services: 

## === ------- Backend Instance [1] -------- ===
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: disney-backend-1
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - INSTANCE_ID=backend_1  
    volumes:
      - ./backend/data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    expose:
      - "5000"
    networks:
      - disney-networks
    restart: unless-stopped

## === ------ Backend instance [2] (load balancer) -------
  backend_2:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: disney-backend-2
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - INSTANCE_ID=backend_2
    volumes:
      - ./backend/data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    expose:
      - "5000"
    networks:
      - disney-networks
    restart: unless-stopped


## === ------ Frontend -------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_ENVIRONMENT: production
    container_name: disney-frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - disney-networks
    restart: unless-stopped
    depends_on:
      - backend


## === ------ Nginx - Reverse Proxy + Load Balancer -------
  nginx: 
    image: nginx:alpine
    container_name: disney-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - backend_2
      - frontend
    networks:
      - disney-networks
    restart: unless-stopped


networks:
  disney-networks:
    driver: bridge
