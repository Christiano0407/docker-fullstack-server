# [nginx spa CONF] ============================================================== #
# - nginx-spa.conf
# - Dentro del contenedor frontend — sirve el build de React
# - Redirige todo a index.html para que React Router funcione
# =============================================================================== #

server {
  listen 80; 
  server_name localhost;
  root /usr/share/nginx/html; 
  index index.html

  # React Router — cualquier ruta sirve index.html
  location / {
    try_files $uri $uri/ /index.html; 
  }

  # Cache para assets estáticos
  location ~* \.(js|css|png|jpg|ico|svg|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

}